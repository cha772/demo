# 编码预览与编辑测试样本

测试目标：核验平台对非 UTF-8 文本文件的在线预览与编辑行为。

中文样例：中文、简体中文、欢迎使用、库存管理、研发协作、北京、上海、广州、深圳。
全角符号：，。！？；：“”‘’（）【】《》——……￥
半角符号：, . ! ? ; : " ' ( ) [ ] { } < > @ # $ % ^ & * _ - + = / \ |

属性示例：
application.name=历史库存管理服务
application.description=用于验证GBK和GB18030编码的在线预览与编辑支持
operator.name=张三
operator.department=研发效能组

最后一行：请在网页预览后尝试编辑，在末尾追加“编辑验证：平台名称 + 日期”，保存后重新打开并下载，核对内容和编码行为。

边界字符：
生僻字示例：𠮷、㐀、龘
说明：本行包含 GBK 无法完整表示的字符，用于验证 GB18030 的字符覆盖与平台显示行为。
